name: Synapse (Notify Ring)

on:
  push:
    branches: [ main ]

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Coordinates
        id: coords
        run: |
          # Ім'я репо: 0-ts
          REPO_NAME=${{ github.event.repository.name }}
          # Кільце: 0
          RING_NAME=$(echo $REPO_NAME | cut -d'-' -f1)
          echo "RING=$RING_NAME" >> $GITHUB_OUTPUT

      - name: Trigger Ring Update
        # Ми посилаємо сигнал (dispatch) у репо s0fractal/0
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: s0fractal/${{ steps.coords.outputs.RING }}
          event-type: update-node
          client-payload: '{"node": "${{ github.event.repository.name }}"}'
